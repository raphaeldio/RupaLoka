# Blueprint Render untuk API Rupaloka (FastAPI).
# Tanpa rootDir: berkas di luar rootDir tidak tersedia di Render, padahal API membaca content/.
services:
  - type: web
    name: rupaloka-api
    runtime: python
    plan: free                      # tidur setelah idle; lihat SDD §15 soal cold start
    region: singapore
    buildCommand: pip install -r backend/requirements.txt && python backend/scripts/validate_content.py
    # --no-proxy-headers: IP klien ditentukan app/security.py (TRUSTED_PROXY_HOPS), bukan uvicorn.
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
        - content/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CONTENT_STRICT
        value: "false"              # ubah ke "true" untuk rilis lomba (T-067)
      - key: ALLOWED_ORIGINS
        sync: false                 # mis. https://rupaloka.vercel.app,http://localhost:5173
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MIN_SCORE
        value: "6.5"               # gerbang dua jalur; kalibrasi: eval_rag.py --strict
      - key: RATE_LIMIT_PER_MIN
        value: "20"
      - key: GLOBAL_RATE_LIMIT_PER_MIN
        value: "120"                # semua IP; pengaman kuota Gemini (T-064)
      - key: TRUSTED_PROXY_HOPS
        value: "2"                  # > 0 = di belakang proxy; IP dari CF-Connecting-IP / Vercel (SDD ADR 33)
      - key: ENABLE_DOCS
        value: "false"              # matikan /docs di produksi
      - key: MASCOT_NAME
        sync: false
      - key: SUPABASE_URL
        value: https://wsolgzmnqccvdbsmymuf.supabase.co   # proyek Supabase "rupaloka" (bukan rahasia)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                 # RAHASIA: isi manual di dashboard Render
      - key: LEADERBOARD_RATE_LIMIT_PER_MIN
        value: "10"                 # per IP, untuk POST /api/leaderboard
      # Suara Saloka (ElevenLabs TTS, SDD ADR 42). Tanpa kunci/voice: klien pakai suara peramban.
      - key: ELEVENLABS_API_KEY
        sync: false                 # RAHASIA: isi manual di dashboard Render
      - key: ELEVENLABS_VOICE_ID
        value: JBFqnCBsd6RMkjVDRZzb   # voice bawaan "George" (akun gratis tidak bisa voice Library via API)
      - key: ELEVENLABS_MODEL
        value: eleven_multilingual_v2
      - key: TTS_RATE_LIMIT_PER_MIN
        value: "30"                 # per IP, untuk POST /api/tts
      - key: TTS_GLOBAL_RATE_LIMIT_PER_MIN
        value: "120"
      - key: TTS_DAILY_CHAR_LIMIT
        value: "20000"              # pengaman kredit ElevenLabs (karakter per hari, semua pengguna)
