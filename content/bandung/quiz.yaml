intro:
  # --- Titik 1: Pengenalan Bandung (sejarah kota, bangunan) ---
  - id: q1
    question: "Siapa pendiri Kota Bandung?"
    options: ["Herman Willem Daendels", "R.A. Wiranatakusumah II", "Ir. J. Gerber", "Mang Udjo Ngalagena"]
    correct: 1
    explanation: "Pendiri Kota Bandung adalah Bupati R.A. Wiranatakusumah II. Daendels adalah gubernur jenderal yang meminta ibu kota kabupaten dipindah mendekati Jalan Raya Pos."
    chunk: pengenalan-bandung-001
  - id: q2
    question: "Jalan Raya Pos dibangun dari Anyer sampai di mana?"
    options: ["Cirebon", "Semarang", "Panarukan", "Surabaya"]
    correct: 2
    explanation: "Jalan Raya Pos dibangun dari Anyer sampai Panarukan, sekitar 1.000 km. Ibu kota Kabupaten Bandung lalu dipindah mendekati jalan itu."
    chunk: pengenalan-bandung-002
  - id: q3
    question: "Apa yang terjadi pada 1 April 1906?"
    options: ["Konferensi Asia Afrika dibuka", "Gemeente Bandung berdiri", "Gedung Sate selesai", "Museum Sri Baduga diresmikan"]
    correct: 1
    explanation: "Pada 1 April 1906 berdiri Gemeente Bandung sebagai kota otonom. Tanggal itu bukan hari jadi kota; hari jadi Bandung adalah 25 September."
    chunk: pengenalan-bandung-003
  - id: q4
    question: "Di gedung mana Konferensi Asia Afrika 1955 berlangsung?"
    options: ["Gedung Sate", "Gedung Merdeka", "Museum Sri Baduga", "Saung Angklung Udjo"]
    correct: 1
    explanation: "Konferensi Asia Afrika berlangsung pada 18-24 April 1955 di Gedung Merdeka, Bandung."
    chunk: pengenalan-bandung-004
  - id: q5
    question: "Julukan Paris van Java dikaitkan dengan jalan apa?"
    options: ["Jalan Braga", "Jalan Dago", "Jalan Cihampelas", "Jalan Setiabudi"]
    correct: 0
    explanation: "Julukan Paris van Java disebut muncul di Jalan Braga, seiring masuknya budaya Eropa pada masa kolonial."
    chunk: pengenalan-bandung-005
  - id: q6
    question: "Siapa arsitek Gedung Sate?"
    options: ["Ir. J. Gerber", "C.P. Wolff Schoemaker", "Daeng Soetigna", "R.A. Wiranatakusumah II"]
    correct: 0
    explanation: "Gedung Sate dirancang arsitek Ir. J. Gerber dan dibangun mulai 27 Juli 1920 sampai 1924."
    chunk: pengenalan-bandung-006
  - id: q7
    question: "Bioskop pertama di Bandung yang berada di Braga bernama?"
    options: ["Majestic", "Dago Theater", "Palaguna", "Concordia"]
    correct: 0
    explanation: "Majestic, yang berdiri di Jalan Braga, adalah bioskop pertama di Bandung."
    chunk: pengenalan-bandung-008

  # --- Titik 2: Angklung ---
  - id: q8
    question: "Tahun berapa angklung diakui UNESCO?"
    options: ["2008", "2010", "1938", "1966"]
    correct: 1
    explanation: "Angklung diakui UNESCO sebagai warisan budaya takbenda pada 2010. Tahun 1938 adalah saat Daeng Soetigna mengembangkan angklung diatonis."
    chunk: angklung-001
  - id: q9
    question: "Tahun berapa Saung Angklung Udjo berdiri?"
    options: ["1938", "1966", "1980", "2010"]
    correct: 1
    explanation: "Saung Angklung Udjo berdiri pada 1966 di Padasuka, Bandung, dirintis Mang Udjo Ngalagena dan Uum Sumiati."
    chunk: angklung-003

  # --- Titik 3: Wayang golek ---
  - id: q10
    question: "Tahun berapa wayang diakui UNESCO?"
    options: ["2008", "2010", "1938", "1980"]
    correct: 0
    explanation: "Wayang diakui UNESCO sebagai warisan budaya takbenda pada 2008."
    chunk: wayang-golek-001
  - id: q11
    question: "Tokoh wayang golek berupa apa?"
    options: ["Boneka kulit pipih", "Boneka kayu tiga dimensi", "Lukisan di atas kain", "Topeng kayu"]
    correct: 1
    explanation: "Wayang golek berupa boneka kayu tiga dimensi."
    chunk: wayang-golek-002

  # --- Titik 4: Museum Sri Baduga ---
  - id: q12
    question: "Pada tahun berapa Museum Sri Baduga diresmikan?"
    options: ["1955", "1966", "1980", "2010"]
    correct: 2
    explanation: "Museum Sri Baduga diresmikan pada 5 Juni 1980 dan memakai nama Sri Baduga sejak 1990."
    chunk: museum-sri-baduga-002
  - id: q13
    question: "Museum Sri Baduga adalah museum negeri milik provinsi mana?"
    options: ["Jawa Tengah", "Banten", "Jawa Barat", "DKI Jakarta"]
    correct: 2
    explanation: "Museum Sri Baduga adalah Museum Negeri Provinsi Jawa Barat, berada di Jl. BKR No.185, Bandung."
    chunk: museum-sri-baduga-001
  - id: q14
    question: "Koleksi Museum Sri Baduga disusun sebagai alur sejarah apa?"
    options: ["Sejarah kereta api Indonesia", "Alam dan budaya Jawa Barat", "Perang kemerdekaan saja", "Kerajaan-kerajaan di Bali"]
    correct: 1
    explanation: "Koleksi Museum Sri Baduga disusun sebagai alur sejarah alam dan budaya Jawa Barat, dari masa prasejarah hingga masa kolonial."
    chunk: museum-sri-baduga-003

