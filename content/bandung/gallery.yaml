# Galeri 3D Bandung: lorong melingkar + penampil objek + maskot pemandu (SDD ADR 40).
# Spesifikasi: docs/superpowers/specs/2026-11-25-galeri-3d-vr-design.md.
# Fitur premium; di klien hanya tampil bila VITE_FLAGS memuat viewer3d,premium_content.
#
# ATURAN TEKS: short_explanation dan asal_usul DISALIN APA ADANYA dari chunk di knowledge/
# (bukan ditulis ulang). Objek tanpa chunk bersumber = null ("sedang disusun tim budaya").
# Chunk yang dipakai belum diverifikasi KH (lihat verified_by di knowledge/).

room:
  model: assets/models/galeri-bandung.glb   # lorong cincin, cahaya di-bake (T-121; belum dibuat)

# Parameter cincin dibaca sama oleh frontend (cameraFlow.ts) dan validator (app/ring.py).
# GLB ruangan harus punya empty pedestal_1..pedestal_{slots} di posisi jalur ini (±0,1 m).
layout:
  radius: 6        # jari-jari garis tengah lorong (m), minimal 6
  slots: 12        # pedestal di keliling; slot tanpa objek = "Segera hadir"
  first_d: 3       # jarak pedestal pertama dari titik awal (m)

# Urutan = pedestal_1, pedestal_2, ...
# item: item koleksi game yang sudah ada (nama, penjelasan, model dari items/<id>.yaml)
# object: objek khusus museum (bukan hadiah game)
exhibits:
  - item: item-angklung          # model belum ada (angklung.blend tidak ada di Aset 3D) -> pengganti
    asal_usul:
      text: "Nama angklung diambil dari bunyinya, \"klung, klung\". Angklung adalah alat musik masyarakat Sunda yang berasal dari Jawa Barat."
      chunk: angklung-010

  - item: item-wayang            # model dari Aset 3D/wayang.blend (VoxelWayangPrabu); cek KH
    asal_usul:
      text: "Wayang adalah bentuk bercerita kuno yang berasal dari Pulau Jawa. Selama sepuluh abad wayang berkembang di istana kerajaan Jawa dan Bali serta di pedesaan, lalu menyebar ke Lombok, Madura, Sumatra, dan Kalimantan."
      chunk: wayang-golek-006

  - object:
      id: gedung-sate
      name: "Gedung Sate"
      short_explanation:
        text: "Gedung Sate awalnya menjadi pusat administrasi pemerintah kolonial. Kini gedung ini menjadi kantor Pemerintah Provinsi Jawa Barat dan memuat Museum Gedung Sate."
        chunk: pengenalan-bandung-007
      model:
        src: assets/models/museum-gedung-sate.glb   # dari Aset 3D/gedung sate.blend
        accuracy_check: null
    asal_usul:
      text: "Gedung Sate dibangun mulai 27 Juli 1920 sampai 1924 dan dirancang arsitek Ir. J. Gerber. Hiasan di puncaknya mirip tusuk sate dengan enam bulatan, yang dipercaya melambangkan enam juta gulden biaya pembangunannya."
      chunk: pengenalan-bandung-006

  - object:
      id: keris
      name: "Keris"
      short_explanation: null      # [PERLU DIISI] KH: belum ada chunk bersumber tentang keris
      model:
        src: assets/models/museum-keris.glb         # dari Aset 3D/keris_3D.blend
        accuracy_check: null
    asal_usul: null                # [PERLU DIISI] KH: asal usul keris + chunk sumber

  - object:
      id: rumah-adat
      name: "Rumah Adat"           # [PERLU DIISI] KH: nama/jenis rumah adat yang dimodelkan
      short_explanation: null      # [PERLU DIISI] KH: belum ada chunk bersumber
      model:
        src: assets/models/museum-rumah-adat.glb    # dari Aset 3D/rumah_adat.blend
        accuracy_check: null
    asal_usul: null                # [PERLU DIISI] KH

# Maskot pemandu (Saloka). Jawaban tetap lewat agen bersumber (/api/chat).
guide:
  model: assets/models/maskot-saloka.glb            # dari Aset 3D/maskot_3D.blend

# Persetujuan anggota budaya (KH) atas isi galeri: { name: "<nama>", approved_at: YYYY-MM-DD }
approved_by_kh: null
