id: angklung
title: "Angklung"
narrative: |
  Pernahkah kamu mendengar bunyi bambu yang bergetar merdu? Itulah angklung! Angklung adalah alat musik dari bambu yang dimainkan dengan cara digoyangkan, bukan dipukul atau ditiup.

  Angklung sangat berharga bagi Indonesia. Pada 2010, UNESCO mencatat angklung dalam Daftar Representatif Warisan Budaya Takbenda. Artinya, dunia mengakui angklung sebagai warisan budaya yang perlu dijaga. Pengetahuan tentang angklung diwariskan secara lisan dari generasi ke generasi, dan kini makin banyak diajarkan di sekolah.

  Angklung juga terus berkembang. Pada 1938, Daeng Soetigna memperkenalkan angklung diatonis, yang sering disebut angklung padaeng. Angklung ini bisa memainkan tangga nada Barat, yaitu susunan nada do-re-mi.

  Di Bandung ada tempat yang terkenal untuk mengenal angklung, yaitu Saung Angklung Udjo. Tempat ini berdiri pada 1966 di Padasuka, Bandung, dirintis Mang Udjo Ngalagena dan Uum Sumiati. Di sana ada pertunjukan angklung, dan anak-anak bisa belajar budaya Sunda.
key_facts:
  - text: "Angklung dimainkan dengan cara digoyangkan."
    chunk: angklung-001
  - text: "Angklung diakui UNESCO sebagai warisan budaya takbenda pada 2010."
