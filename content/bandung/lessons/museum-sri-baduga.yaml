id: museum-sri-baduga
title: "Museum Sri Baduga"
narrative: |
  Mau melihat sejarah Jawa Barat dalam satu tempat? Datanglah ke Museum Sri Baduga! Museum ini adalah Museum Negeri Provinsi Jawa Barat dan berada di Jl. BKR No.185, Bandung.

  Museum Sri Baduga diresmikan pada 5 Juni 1980. Nama Sri Baduga sendiri baru dipakai sejak 1990. Jadi, kalau kamu menemukan catatan lama dengan nama berbeda, itu wajar.

  Koleksinya banyak sekali. Pada 2017, museum ini menyimpan 6.979 koleksi tentang sejarah dan budaya Sunda. Koleksi itu disusun sebagai alur sejarah alam dan budaya Jawa Barat, mulai dari masa prasejarah sampai masa kolonial. Saat berjalan dari ruang ke ruang, kamu seperti membaca buku sejarah yang bisa dilihat langsung.

  Sebelum berkunjung, ajak teman atau keluarga dan siapkan pertanyaan. Benda apa yang paling tua? Bagaimana kehidupan orang Sunda zaman dulu? Kalau ada yang belum jelas, kamu juga bisa bertanya kepada pemandu Rupaloka. Setelah selesai belajar di sini, kamu siap untuk petualangan keliling kota!
