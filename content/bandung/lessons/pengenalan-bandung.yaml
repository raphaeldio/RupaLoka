id: pengenalan-bandung
title: "Pengenalan Bandung"
narrative: |
  Selamat datang di Bandung! Kota ini berulang tahun setiap 25 September. Tanggal itu mengacu pada tahun 1810, dan pendiri kotanya adalah Bupati R.A. Wiranatakusumah II.

  Dulu ibu kota Kabupaten Bandung ada di Krapyak, yang sekarang bernama Dayeuhkolot, sekitar 11 km di selatan pusat kota. Gubernur Jenderal Daendels membangun Jalan Raya Pos dari Anyer sampai Panarukan, lalu meminta ibu kota dipindah mendekati jalan itu.

  Sejak 1864 Bandung menjadi ibu kota Keresidenan Priangan. Pada 1 April 1906 berdiri Gemeente Bandung sebagai kota otonom, tetapi tanggal itu bukan hari jadi kota.

  Kota ini punya banyak bangunan bersejarah. Gedung Sate dibangun pada 1920 sampai 1924 dan dirancang Ir. J. Gerber. Enam bulatan di puncaknya dipercaya melambangkan enam juta gulden biaya pembangunannya. Di Gedung Merdeka, Konferensi Asia Afrika berlangsung pada 18 sampai 24 April 1955. Jalan Braga juga terkenal: julukan Paris van Java disebut muncul di sana, dan di Braga berdiri Majestic, bioskop pertama di Bandung.
