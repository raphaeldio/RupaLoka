id: wayang-golek
title: "Wayang Golek"
narrative: |
  Kenalan dulu dengan wayang golek! Sebelum itu, kita mulai dari wayang secara umum. Pada 2008, UNESCO mencatat wayang dalam Daftar Representatif Warisan Budaya Takbenda. Artinya, dunia mengakui wayang sebagai warisan budaya yang perlu dijaga bersama.

  Lalu, apa itu wayang golek? Wayang golek adalah boneka kayu tiga dimensi. Kata "tiga dimensi" berarti bonekanya punya panjang, lebar, dan tebal, seperti patung kecil. Coba bayangkan boneka itu dilihat dari depan, lalu dari samping: bentuknya tetap utuh.

  Salah satu tokoh wayang golek Sunda yang paling dikenal adalah Si Cepot, yang juga bernama Astrajingga. Cepot adalah tokoh punakawan. Wajahnya merah, dan ia melambangkan kecerdikan, keberanian, dan kejujuran rakyat kecil.

  Nanti di game, kamu bisa menemukan wayang golek dan Si Cepot sebagai item koleksi. Kumpulkan dan pelajari ceritanya!
