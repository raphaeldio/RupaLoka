# Konfigurasi alur dan game kota Bandung (SDD §5.1).
id: bandung
phases: [quiz_intro, lessons, game, summary]

# Titik path belajar, berurutan (titik ke-1 terbuka dulu, berikutnya terbuka setelah yang
# sebelumnya selesai). Tiap titik = kuis (soal di quiz.yaml yang chunk-nya milik materi ini)
# lalu kartu materi. Titik game ditambahkan otomatis di akhir. KANDIDAT, BELUM FINAL (T-002, KH).
# Setiap id wajib punya lessons/<id>.yaml.
lessons: [pengenalan-bandung, angklung, wayang-golek, museum-sri-baduga]

game:
  unlock_every: 10            # METER lari per item; tiap ambang pelari bertemu NPC (F-043; diubah 20 Nov 2026 dari 1000 poin)
  # Item ke-k terbuka di ambang ke-k (100, 200, 300 m). 1 m = 10 poin skor. Setelah habis, game lanjut tanpa jeda.
  items_order: [item-angklung, item-wayang, item-cepot]
  # Rintangan: harus terdaftar di sources.yaml (objects) dan disetujui KH. [PERLU DIISI daftar final]
  obstacles: [batu, pagar, becak]
  background: bandung-day      # id latar di assets/sprites (T-054)
  speed: { start: 240, max: 520, ramp_per_100: 25 }   # piksel/detik; kalibrasi saat uji

# Poin path dan lencana (DRAF 20 Nov 2026; angka dan nama boleh diubah tim).
# 4 titik materi × 100 + titik game 100 = 500, ditambah 10 per jawaban kuis benar.
rewards:
  points_per_node: 100
  points_per_correct: 10        # soal fakta
  points_per_value: 30          # soal nilai (kind: nilai) — poin terbesar (masukan juri, 25 Nov 2026)
  points_per_reflection: 50     # refleksi akhir tur yang dikenali (reflection.yaml)
  game_node_points: 100
  # Skor game terbaik ikut dijumlahkan ke poin kota (21 Nov 2026), dibatasi nilai ini.
  # Diturunkan 3000 -> 300 (25 Nov 2026) agar peringkat "Si Paling Bandung" mencerminkan
  # pemahaman, bukan kecepatan berlari.
  game_score_cap: 300
  # Papan peringkat akhir tur (21 Nov 2026): skor = total poin path; peringkat 1 bergelar champion_title.
  leaderboard:
    champion_title: "Si Paling Bandung"
  badges:
    - id: penjelajah-pemula
      name: "Penjelajah Pemula"
      min_points: 100
      description: "Menyelesaikan titik pertama perjalanan."
    - id: penjelajah-kota
      name: "Penjelajah Kota"
      min_points: 300
      description: "Sudah mengenal beberapa budaya kota ini."
    - id: sahabat-budaya
      name: "Sahabat Budaya"
      min_points: 500
      description: "Menuntaskan seluruh perjalanan kota ini."
