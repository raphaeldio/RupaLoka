  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: pengenalan-bandung-007
  lesson_id: pengenalan-bandung
  text: "Gedung Sate awalnya menjadi pusat administrasi pemerintah kolonial. Kini gedung ini menjadi kantor Pemerintah Provinsi Jawa Barat dan memuat Museum Gedung Sate."
  source:
    title: "Good News from Indonesia. Melacak jejak sejarah Gedung Sate Bandung"
