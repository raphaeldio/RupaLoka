- id: pengenalan-bandung-009
  # dari KB chunk 2.1
  lesson_id: pengenalan-bandung
  text: "Kota Bandung adalah ibu kota Provinsi Jawa Barat sekaligus kota metropolitan terbesar di provinsi itu. Bandung terletak di dataran tinggi dengan ketinggian rata-rata 768 meter di atas permukaan laut."
  source:
    title: "Badan Pusat Statistik Kota Bandung. Kota Bandung Dalam Angka"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: pengenalan-bandung-010
  # dari KB chunk 2.1
  lesson_id: pengenalan-bandung
  text: "Bandung dikelilingi pegunungan sehingga bentuk wilayahnya berupa cekungan yang dikenal sebagai Cekungan Bandung (Bandung Basin). Karena itu iklimnya relatif sejuk, dengan suhu rata-rata sekitar 19°C hingga 28°C."
  source:
    title: "Badan Pusat Statistik Kota Bandung. Kota Bandung Dalam Angka"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: pengenalan-bandung-011
  # dari KB chunk 2.1; julukan Kota Kembang dulu SENGAJA ditahan tim (perlu verifikasi); sumber pendamping: bandung.go.id
  lesson_id: pengenalan-bandung
  text: "Bandung punya dua julukan terkenal: Kota Kembang, karena keindahan tata kota dan banyaknya taman bunga pada masa kolonial, dan Paris van Java, karena menjadi pusat mode, gaya hidup, dan hiburan bergaya Eropa di Hindia Belanda pada awal abad ke-20."
  source:
    title: "Badan Pusat Statistik Kota Bandung. Kota Bandung Dalam Angka"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: pengenalan-bandung-012
  # dari KB chunk 2.2; 25 Mei (surat permintaan) dan 25 Sep (surat keputusan) adalah dua surat berbeda, lihat pengenalan-bandung-037
  lesson_id: pengenalan-bandung
  text: "Kota Bandung modern bermula dari masa Gubernur Jenderal Herman Willem Daendels, yang membangun Jalan Raya Pos (De Grote Postweg) pada 1808. Pada 25 September 1810, Daendels mengeluarkan surat keputusan pemindahan ibu kota Kabupaten Bandung dari Krapyak (Dayeuhkolot) ke tepi Sungai Cikapundung, kawasan Alun-Alun Bandung sekarang. Tanggal 25 September 1810 kemudian diperingati sebagai hari jadi Kota Bandung."
  source:
    title: "Kunto, Haryoto (1984). Wajah Bandoeng Tempo Doeloe. Granesia"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: pengenalan-bandung-013
  # dari KB chunk 2.2; Bandung Lautan Api dulu SENGAJA ditahan tim (perlu verifikasi); tanggal 23-24 Maret dan angka 200.000 belum ada di sumber resmi yang dicek 26 Nov (lihat -038); sumber pendamping: Kunto (1984), portal sejarah Pemkot
  lesson_id: pengenalan-bandung
  text: "Pada 23-24 Maret 1946 terjadi peristiwa Bandung Lautan Api. Sekitar 200.000 penduduk Bandung membakar rumah dan harta benda mereka lalu mengungsi ke pegunungan di selatan, agar tentara Sekutu dan NICA tidak bisa menjadikan Bandung markas militer."
  source:
    title: "Smail, John R.W. Bandung in the Early Revolution, 1945-1946. Cornell University"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: pengenalan-bandung-014
  # dari KB chunk 2.2; periksa KH: kaitan waktu dengan Bandung Lautan Api
  lesson_id: pengenalan-bandung
  text: "Masa perjuangan itu melahirkan pahlawan Mohammad Toha, yang gugur saat meledakkan gudang mesiu milik Sekutu di Dayeuhkolot."
  source:
    title: "Smail, John R.W. Bandung in the Early Revolution, 1945-1946. Cornell University"
