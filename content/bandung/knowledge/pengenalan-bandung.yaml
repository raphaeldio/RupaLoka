- id: pengenalan-bandung-002
  lesson_id: pengenalan-bandung
  text: "Dulu ibu kota Kabupaten Bandung berada di Krapyak (sekarang Dayeuhkolot), sekitar 11 km di selatan pusat kota. Gubernur Jenderal Daendels membangun Jalan Raya Pos dari Anyer sampai Panarukan, sekitar 1.000 km, lalu lewat surat 25 Mei 1810 meminta ibu kota dipindah mendekati jalan itu."
  source:
    title: "Pemerintah Kota Bandung. Sejarah Bandung"
    url: https://www.bandung.go.id/sejarah?lang=en
    type: web
    accessed: 2026-11-21
  verified_by: null         # nama pemeriksa (KH)
  verified_at: null

- id: pengenalan-bandung-003
  lesson_id: pengenalan-bandung
  text: "Sejak 7 Agustus 1864 Bandung menjadi ibu kota Keresidenan Priangan, menggantikan Cianjur yang rusak akibat letusan Gunung Gede. Pada 1 April 1906 berdiri Gemeente Bandung sebagai kota otonom, lalu menjadi stadsgemeente pada 1 Oktober 1926. Tanggal 1 April 1906 bukan hari jadi kota."
  source:
    title: "Pemerintah Kota Bandung. Sejarah Bandung"
    url: https://www.bandung.go.id/sejarah?lang=en
    type: web
    accessed: 2026-11-21
