  # dari KB chunk 2.3; jumlah negara dulu ditahan tim; 29 negara dikuatkan laman Pemkot Bandung 2024 (pengenalan-bandung-039); sumber pendamping: Final Communique KAA (24 April 1955)
  lesson_id: pengenalan-bandung
  text: "Konferensi Asia-Afrika (KAA) pada 18-24 April 1955 dihadiri perwakilan 29 negara merdeka dan setengah merdeka dari Asia dan Afrika. Konferensi ini berlangsung di Gedung Merdeka, dulu bernama Sociëteit Concordia, di Jalan Asia Afrika."
