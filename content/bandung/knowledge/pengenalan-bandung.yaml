- id: pengenalan-bandung-006
  lesson_id: pengenalan-bandung
  text: "Gedung Sate dibangun mulai 27 Juli 1920 sampai 1924 dan dirancang arsitek Ir. J. Gerber. Hiasan di puncaknya mirip tusuk sate dengan enam bulatan, yang dipercaya melambangkan enam juta gulden biaya pembangunannya."
  source:
    title: "Good News from Indonesia. Melacak jejak sejarah Gedung Sate Bandung"
    url: https://www.goodnewsfromindonesia.id/indonesiana/wisata/melacak-jejak-sejarah-gedung-sate-bandung
