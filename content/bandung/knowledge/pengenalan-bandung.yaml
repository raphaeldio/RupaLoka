- id: pengenalan-bandung-001
  lesson_id: pengenalan-bandung
  text: "Bandung berulang tahun setiap 25 September. Tanggal itu mengacu pada tahun 1810 dan ditetapkan lewat Perda No. 35 Tahun 1998. Pendiri Kota Bandung adalah Bupati R.A. Wiranatakusumah II, yang memerintah pada 1794-1829."
  source:
    title: "Pemerintah Kota Bandung. Sejarah Bandung"
