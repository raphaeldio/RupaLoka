- id: pengenalan-bandung-026
  # dari KB chunk 2.6; sumber pendamping: Disbudpar Kota Bandung, Panduan Wisata Kuliner
  lesson_id: pengenalan-bandung
  text: "Kuliner Bandung memadukan cita rasa tradisional Sunda dengan jajanan kreatif berbahan tepung tapioka (aci) dan rempah-rempah. Batagor (bakso tahu goreng) adalah olahan tahu dan adonan ikan tenggiri yang digoreng renyah, disajikan dengan saus kacang, kecap manis, dan perasan jeruk limau."
  source:
