- id: pengenalan-bandung-001
  lesson_id: pengenalan-bandung
  text: "Gedung Sate mulai dibangun pada 27 Juli 1920 dan selesai pada 1924. Perancangnya arsitek Belanda Ir. J. Gerber bersama Eh. de Roo dan G. Hendriks."
  source:
    title: "Good News from Indonesia. Melacak jejak sejarah Gedung Sate Bandung"
    url: https://www.goodnewsfromindonesia.id/indonesiana/wisata/melacak-jejak-sejarah-gedung-sate-bandung
    type: web
    accessed: 2026-11-20
  verified_by: null         # nama pemeriksa (KH); butuh sumber kedua
  verified_at: null

- id: pengenalan-bandung-002
  lesson_id: pengenalan-bandung
  text: "Gedung Sate awalnya menjadi pusat administrasi pemerintah kolonial. Kini gedung ini menjadi kantor Pemerintah Provinsi Jawa Barat dan memuat Museum Gedung Sate."
  source:
    title: "Good News from Indonesia. Melacak jejak sejarah Gedung Sate Bandung"
    url: https://www.goodnewsfromindonesia.id/indonesiana/wisata/melacak-jejak-sejarah-gedung-sate-bandung
    type: web
    accessed: 2026-11-20
  verified_by: null         # nama pemeriksa (KH); butuh sumber kedua
  verified_at: null

- id: pengenalan-bandung-003
  lesson_id: pengenalan-bandung
  text: "Hiasan di puncak Gedung Sate mirip tusuk sate dengan enam bulatan. Enam bulatan itu dipercaya melambangkan enam juta gulden biaya pembangunan."
  source:
    title: "Good News from Indonesia. Melacak jejak sejarah Gedung Sate Bandung"
    url: https://www.goodnewsfromindonesia.id/indonesiana/wisata/melacak-jejak-sejarah-gedung-sate-bandung
    type: web
    accessed: 2026-11-20
  verified_by: null         # nama pemeriksa (KH); butuh sumber kedua
  verified_at: null

- id: pengenalan-bandung-004
  lesson_id: pengenalan-bandung
  text: "Gedung Merdeka dirancang pada 1926 dengan gaya art deco oleh Van Galen dan C.P. Wolff Schoemaker. Di gedung ini berlangsung Konferensi Asia-Afrika pada 1955, dan kini gedung ini menjadi museum yang menyimpan koleksi dan foto konferensi tersebut."
  source:
    title: "Pemerintah Kota Bandung. Gedung Merdeka Bandung"
    url: https://www.bandung.go.id/index.php/features/detail/19/gedung-merdeka-bandung?lang=en
