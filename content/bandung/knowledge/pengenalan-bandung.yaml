  # dari KB chunk 2.5
  lesson_id: pengenalan-bandung
  text: "Sejak 2015, Bandung masuk jaringan UNESCO Creative Cities Network sebagai City of Design (Kota Desain). Ekonominya digerakkan oleh pariwisata, kuliner, jasa, dan industri kreatif seperti fesyen, musik, desain grafis, dan teknologi digital."
