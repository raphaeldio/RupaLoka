- id: pengenalan-bandung-008
  lesson_id: pengenalan-bandung
  text: "Jalan Braga dulu jalan kecil yang dilalui pedati pengangkut hasil bumi, bahkan pernah disebut Jalan Culik. Masa kejayaannya sekitar 1920-1940. Di sana berdiri Majestic, bioskop pertama di Bandung."
