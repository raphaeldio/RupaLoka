  lesson_id: pengenalan-bandung
  text: "Banyak wisata alam di sekitar Bandung berada di Kabupaten Bandung Barat dan Kabupaten Bandung (kawasan Bandung Raya). Di utara ada Gunung Tangkuban Parahu, gunung berapi aktif dengan kawah luas seperti Kawah Ratu yang bisa didatangi sampai bibir kawah."
