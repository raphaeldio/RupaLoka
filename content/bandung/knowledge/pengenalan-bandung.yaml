- id: pengenalan-bandung-005
  lesson_id: pengenalan-bandung
  text: "Julukan Paris van Java disebut muncul di Jalan Braga, seiring masuknya budaya Eropa pada masa kolonial."
  source:
    title: "detikJabar (2025). Kisah Braga Bandung: pedati, Jalan Culik, hingga bangunan ikonik"
    url: https://www.detik.com/jabar/berita/d-7942730/kisah-braga-bandung-pedati-jalan-culik-hingga-bangunan-ikonik
