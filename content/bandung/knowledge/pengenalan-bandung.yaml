- id: pengenalan-bandung-034
  # dari KB chunk 2.7
  lesson_id: pengenalan-bandung
  text: "Di kawasan utara Bandung juga ada hutan pinus Cikole dan Tebing Keraton di Taman Hutan Raya Ir. H. Djuanda (Dago Pakar), yang menawarkan pemandangan lautan kabut dan hutan pinus."
