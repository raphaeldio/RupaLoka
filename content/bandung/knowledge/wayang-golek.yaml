  text: "Cerita dan teknik pertunjukan wayang diwariskan secara lisan di dalam keluarga dalang, pemusik, dan pembuat wayang. Kini wayang harus bersaing dengan hiburan modern seperti video, televisi, dan karaoke."
  source:
