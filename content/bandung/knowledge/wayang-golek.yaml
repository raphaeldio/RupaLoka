- id: wayang-golek-008
  lesson_id: wayang-golek
  text: "Dahulu dalang dihormati sebagai ahli sastra yang menyampaikan nilai moral dan keindahan. Dalang harus menghafal banyak sekali cerita serta membawakan narasi kuno dan tembang puitis."
