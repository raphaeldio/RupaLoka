- id: wayang-golek-003
  lesson_id: wayang-golek
  text: "Dalam pertunjukan wayang, dalang menggerakkan lengan boneka yang dapat berputar dengan tongkat-tongkat ramping. Pertunjukan diiringi penyanyi dan pemusik yang memainkan alat musik perunggu dan kendang gamelan."
  source:
    title: "UNESCO (2008). Wayang puppet theatre (Indonesia)"
    url: https://ich.unesco.org/en/RL/wayang-puppet-theatre-00063
    type: web
    accessed: 2026-11-21
  verified_by: null         # nama pemeriksa (KH)
  verified_at: null

- id: wayang-golek-004
  lesson_id: wayang-golek
  text: "Si Cepot atau Astrajingga adalah tokoh punakawan wayang golek Sunda berwajah merah yang melambangkan kecerdikan, keberanian, dan kejujuran rakyat kecil."
  source:
    title: "Dinas Pariwisata dan Kebudayaan Jawa Barat"
    url: https://disparbud.jabarprov.go.id/
    type: web
    accessed: 2026-11-20
  verified_by: "Tim Budaya"
  verified_at: 2026-11-20

- id: wayang-golek-005
  lesson_id: wayang-golek
  text: "Ada dua jenis utama wayang: boneka kayu tiga dimensi yang disebut wayang klitik atau wayang golek, dan wayang kulit pipih yang dimainkan di depan layar yang diterangi dari belakang. Keduanya punya kostum, raut wajah khas, dan bagian tubuh yang bisa digerakkan."
  source:
    title: "UNESCO (2008). Wayang puppet theatre (Indonesia)"
    url: https://ich.unesco.org/en/RL/wayang-puppet-theatre-00063
    type: web
    accessed: 2026-11-21
  verified_by: null         # nama pemeriksa (KH)
  verified_at: null

- id: wayang-golek-006
  lesson_id: wayang-golek
  text: "Wayang adalah bentuk bercerita kuno yang berasal dari Pulau Jawa. Selama sepuluh abad wayang berkembang di istana kerajaan Jawa dan Bali serta di pedesaan, lalu menyebar ke Lombok, Madura, Sumatra, dan Kalimantan."
  source:
    title: "UNESCO (2008). Wayang puppet theatre (Indonesia)"
    url: https://ich.unesco.org/en/RL/wayang-puppet-theatre-00063
    type: web
    accessed: 2026-11-21
  verified_by: null         # nama pemeriksa (KH)
  verified_at: null

- id: wayang-golek-007
  lesson_id: wayang-golek
  text: "Cerita wayang mengambil tokoh dari mitos asli Nusantara, epos India, dan kisah pahlawan dari Persia."
  source:
    title: "UNESCO (2008). Wayang puppet theatre (Indonesia)"
    url: https://ich.unesco.org/en/RL/wayang-puppet-theatre-00063
    type: web
    accessed: 2026-11-21
  verified_by: null         # nama pemeriksa (KH)
