- id: wayang-golek-004
  lesson_id: wayang-golek
  text: "Si Cepot atau Astrajingga adalah tokoh punakawan wayang golek Sunda berwajah merah yang melambangkan kecerdikan, keberanian, dan kejujuran rakyat kecil."
  source:
