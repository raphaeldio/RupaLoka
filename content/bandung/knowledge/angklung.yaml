- id: angklung-001
  lesson_id: angklung
  text: "Angklung adalah alat musik dari bambu yang dimainkan dengan cara digoyangkan. Pada 2010, angklung tercatat dalam Daftar Representatif Warisan Budaya Takbenda UNESCO. Pengetahuannya diwariskan secara lisan dan kini semakin diajarkan di lembaga pendidikan."
  source:
    title: "UNESCO (2010). Angklung (Indonesia)"
    url: https://ich.unesco.org/en/RL/00393
    type: web
    accessed: 2026-11-20
  verified_by: null         # nama pemeriksa (KH)
  verified_at: null

- id: angklung-002
  lesson_id: angklung
  text: "Pada 1938, Daeng Soetigna memperkenalkan angklung diatonis (angklung padaeng) yang dapat memainkan tangga nada Barat."
  source:
    title: "UNESCO (2010). Angklung (Indonesia)"
    url: https://ich.unesco.org/en/RL/00393
    type: web
    accessed: 2026-11-20
  verified_by: null         # nama pemeriksa (KH)
  verified_at: null

- id: angklung-003
  lesson_id: angklung
  text: "Saung Angklung Udjo didirikan pada 1966 di Padasuka, Bandung, oleh Mang Udjo Ngalagena dan istrinya, Uum Sumiati. Tempat ini menampilkan pertunjukan angklung dan menjadi pusat belajar budaya Sunda dan angklung bagi anak-anak."
  source:
    title: "Saung Angklung Udjo. Sejarah"
    url: https://angklung-udjo.co.id/heritage/history
    type: web
    accessed: 2026-11-20
  verified_by: null         # nama pemeriksa (KH); CLAUDE.md: peran Saung Angklung Udjo wajib diverifikasi
  verified_at: null

# Tambahkan angklung-004 dan seterusnya sampai minimal 8 chunk.

- id: angklung-004
  lesson_id: angklung
  text: "Satu angklung terdiri atas dua sampai empat tabung bambu yang digantung pada rangka bambu dan diikat dengan tali rotan. Tabung-tabungnya diraut dan dipotong oleh perajin ahli agar menghasilkan nada tertentu."
  source:
    title: "UNESCO (2010). Indonesian Angklung"
    url: https://ich.unesco.org/en/RL/00393
    type: web
    accessed: 2026-11-21
  verified_by: null         # nama pemeriksa (KH)
  verified_at: null

- id: angklung-005
  lesson_id: angklung
  text: "Angklung berbunyi ketika rangka bambunya digoyangkan atau diketuk. Setiap angklung hanya menghasilkan satu nada atau satu akor, sehingga beberapa pemain harus bekerja sama untuk memainkan sebuah melodi."
  source:
    title: "UNESCO (2010). Indonesian Angklung"
    url: https://ich.unesco.org/en/RL/00393
    type: web
    accessed: 2026-11-21
  verified_by: null         # nama pemeriksa (KH)
  verified_at: null

- id: angklung-006
  lesson_id: angklung
  text: "Angklung tradisional memakai tangga nada pentatonis (lima nada). Angklung bertangga nada diatonis baru diperkenalkan Daeng Soetigna pada 1938."
  source:
    title: "UNESCO (2010). Indonesian Angklung"
    url: https://ich.unesco.org/en/RL/00393
    type: web
    accessed: 2026-11-21
  verified_by: null         # nama pemeriksa (KH)
  verified_at: null

- id: angklung-007
  # UNESCO: 'black bamboo', 'when the cicadas sing'; terjemahan cicada = tonggeret, periksa KH
  lesson_id: angklung
  text: "Angklung dibuat dari bambu hitam khusus yang dipanen pada dua minggu dalam setahun ketika tonggeret berbunyi. Bambu dipotong sedikitnya tiga ruas di atas tanah agar akarnya terus tumbuh."
  source:
    title: "UNESCO (2010). Indonesian Angklung"
    url: https://ich.unesco.org/en/RL/00393
    type: web
    accessed: 2026-11-21
  verified_by: null         # nama pemeriksa (KH)
  verified_at: null

- id: angklung-008
  lesson_id: angklung
  text: "Angklung erat kaitannya dengan adat, seni, dan identitas budaya di Indonesia. Angklung dimainkan dalam upacara seperti menanam padi, panen, dan khitanan."
  source:
    title: "UNESCO (2010). Indonesian Angklung"
    url: https://ich.unesco.org/en/RL/00393
    type: web
    accessed: 2026-11-21
  verified_by: null         # nama pemeriksa (KH)
  verified_at: null

- id: angklung-009
  lesson_id: angklung
  text: "Karena dimainkan bersama-sama, bermain angklung melatih kerja sama dan saling menghormati, juga disiplin, tanggung jawab, konsentrasi, imajinasi, daya ingat, serta rasa seni dan musik."
  source:
    title: "UNESCO (2010). Indonesian Angklung"
    url: https://ich.unesco.org/en/RL/00393
    type: web
    accessed: 2026-11-21
  verified_by: null         # nama pemeriksa (KH)
  verified_at: null

- id: angklung-010
  # artikel opini peneliti independen di situs Setneg; periksa KH
  lesson_id: angklung
  text: "Nama angklung diambil dari bunyinya, \"klung, klung\". Angklung adalah alat musik masyarakat Sunda yang berasal dari Jawa Barat."
