# Sumber disalin dari 'Sumber Rujukan' KB; belum dibuka/diperiksa (accessed null).
# Kalimat KB yang bentrok dengan chunk bersumber di atas TIDAK dimasukkan (lihat laporan).

- id: angklung-014
  # dari KB chunk 1.1
  lesson_id: angklung
  text: "Angklung adalah alat musik multitonal (bernada ganda) tradisional dari masyarakat Sunda di Jawa Barat. Bunyinya muncul dari benturan badan pipa bambu ketika angklung digetarkan atau digoyangkan oleh tangan pemainnya."
  source:
    title: "UNESCO (2010). Indonesian Angklung"
    url: https://ich.unesco.org/en/RL/00393
    type: web
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-015
  # dari KB chunk 1.2
  lesson_id: angklung
  text: "Sejarah angklung berakar pada tradisi agraris masyarakat Sunda sejak masa Kerajaan Sunda (abad ke-12 hingga ke-16). Awalnya angklung dipakai dalam ritual pemujaan Nyai Sri Pohaci (Dewi Sri), dewi kesuburan dan padi, agar panen melimpah."
  source:
    title: "Rosyadi (2012). Angklung: Dari Angklung Tradisional ke Angklung Modern. Patanjala 4(1), BPNB Bandung"
    url: https://doi.org/10.30959/ptj.v4i1.122
    type: jurnal
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-016
  # dari KB chunk 1.2; 'penyemangat pasukan perang' disebut berasal dari tradisi lisan
  lesson_id: angklung
  text: "Angklung pada masa itu memakai tangga nada pentatonis (salendro dan pelog) dan dimainkan dalam upacara panen raya Seren Taun. Menurut tradisi lisan, angklung juga dipakai sebagai penyemangat pasukan perang."
  source:
    title: "Rosyadi (2012). Angklung: Dari Angklung Tradisional ke Angklung Modern. Patanjala 4(1), BPNB Bandung"
    url: https://doi.org/10.30959/ptj.v4i1.122
    type: jurnal
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-017
  # dari KB chunk 1.2
  lesson_id: angklung
  text: "Pada 1938, Daeng Soetigna, guru dan musisi asal Bandung, menciptakan Angklung Padaeng dengan tangga nada diatonis kromatis (do-re-mi-fa-sol-la-si). Inovasi ini membuat angklung bisa memainkan lagu nasional maupun internasional, sehingga angklung berkembang dari alat musik ritual menjadi alat musik orkestra dan pendidikan."
  source:
    title: "Rosyadi (2012). Angklung: Dari Angklung Tradisional ke Angklung Modern. Patanjala 4(1), BPNB Bandung"
    url: https://doi.org/10.30959/ptj.v4i1.122
    type: jurnal
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-018
  # dari KB chunk 1.3; sumber pendamping: dokumentasi teknis Saung Angklung Udjo & BPK Wilayah IX; bandingkan dengan angklung-007 (UNESCO: dipanen saat tonggeret berbunyi)
  lesson_id: angklung
  text: "Kualitas suara angklung sangat bergantung pada bahan baku dan ketelitian pembuatannya. Bambunya berusia 4 hingga 6 tahun dan ditebang pada musim kemarau agar kadar airnya rendah dan tahan terhadap hama bubuk."
  source:
    title: "Widjaja, E.A. (2001). Identikit Jenis-Jenis Bambu di Jawa. LIPI"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-019
  # dari KB chunk 1.3
  lesson_id: angklung
  text: "Bambu yang paling umum dipakai untuk angklung adalah bambu hitam (awi wulung, Gigantochloa atroviolacea) yang suaranya nyaring dan kuat, serta bambu putih (awi temen, Gigantochloa atter) yang suaranya lebih lembut."
  source:
    title: "Widjaja, E.A. (2001). Identikit Jenis-Jenis Bambu di Jawa. LIPI"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-020
  # dari KB chunk 1.3
  lesson_id: angklung
  text: "Satu angklung terdiri atas empat bagian utama: tabung suara (sora), dasar (soko), rangka (raraga), dan pengikat dari tali rotan yang mengikat semua sambungan dengan kokoh namun tetap lentur."
  source:
    title: "Widjaja, E.A. (2001). Identikit Jenis-Jenis Bambu di Jawa. LIPI"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-021
  # dari KB chunk 1.3; jumlah tabung KB (2-3) dibuang 26 Nov: bentrok dengan UNESCO (2-4, dicek ulang), lihat angklung-004
  lesson_id: angklung
  text: "Tabung suara (sora) terdiri atas beberapa tabung bambu dengan panjang dan diameter berbeda. Bagian atasnya diraut untuk menentukan tinggi-rendah nada, umumnya berbeda satu oktaf."
  source:
    title: "Widjaja, E.A. (2001). Identikit Jenis-Jenis Bambu di Jawa. LIPI"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-022
  # dari KB chunk 1.3
  lesson_id: angklung
  text: "Dasar (soko) adalah tabung bambu mendatar di bagian bawah yang berlubang, tempat kaki-kaki tabung suara masuk, berbenturan, dan beresonansi. Rangka (raraga) adalah bilah bambu tegak dan mendatar yang menjadi penyangga sekaligus pegangan pemain."
  source:
    title: "Widjaja, E.A. (2001). Identikit Jenis-Jenis Bambu di Jawa. LIPI"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-023
  # dari KB chunk 1.4; luar Bandung (Banten); periksa KH apakah perlu dan pantas ditampilkan
  lesson_id: angklung
  text: "Angklung Kanekes berasal dari masyarakat Baduy (Kanekes) di Banten. Angklung ini dipakai khusus untuk ritual menanam padi dan hanya boleh dimainkan oleh keturunan tertentu pada waktu yang ditetapkan adat."
  source:
    title: "Direktorat Warisan dan Diplomasi Budaya Kemendikbud RI (2018). Katalog Warisan Budaya Takbenda Indonesia"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-024
  # dari KB chunk 1.4
  lesson_id: angklung
  text: "Angklung Dogdog Lojor berasal dari masyarakat Kasepuhan Pancer Pangawinan di Sukabumi selatan. Angklung ini dimainkan berpasangan dengan alat musik perkusi dogdog lojor dalam tradisi penghormatan padi."
  source:
    title: "Direktorat Warisan dan Diplomasi Budaya Kemendikbud RI (2018). Katalog Warisan Budaya Takbenda Indonesia"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-025
  # dari KB chunk 1.4
  lesson_id: angklung
  text: "Angklung Gubrag berasal dari Cipining, Kabupaten Bogor. Ukurannya besar dan dipakai untuk menghormati Dewi Sri saat musim tanam dan panen."
  source:
    title: "Direktorat Warisan dan Diplomasi Budaya Kemendikbud RI (2018). Katalog Warisan Budaya Takbenda Indonesia"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-026
  # dari KB chunk 1.4
  lesson_id: angklung
  text: "Angklung Buncis adalah seni pertunjukan rakyat dari Ujungberung, Bandung, yang menggabungkan permainan angklung, nyanyian (kawih), dan tarian jenaka."
  source:
    title: "Direktorat Warisan dan Diplomasi Budaya Kemendikbud RI (2018). Katalog Warisan Budaya Takbenda Indonesia"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-027
  # dari KB chunk 1.4
  lesson_id: angklung
  text: "Angklung Padaeng ciptaan Daeng Soetigna bertangga nada diatonis dan terbagi menjadi dua kelompok: angklung melodi yang memainkan nada tunggal, dan angklung akompanimen yang memainkan akor pengiring."
  source:
    title: "Direktorat Warisan dan Diplomasi Budaya Kemendikbud RI (2018). Katalog Warisan Budaya Takbenda Indonesia"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-028
  # dari KB chunk 1.4; dikuatkan angklung-044 (situs Saung Angklung Udjo, 2008)
  lesson_id: angklung
  text: "Angklung Toel adalah inovasi modern dengan rangka gantung yang dikembangkan oleh Yayan Udjo. Pemain cukup menyentuh (menoel) tabung bambu untuk membunyikannya, sehingga satu orang bisa memainkan banyak nada sekaligus."
  source:
    title: "Direktorat Warisan dan Diplomasi Budaya Kemendikbud RI (2018). Katalog Warisan Budaya Takbenda Indonesia"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-029
  # dari KB chunk 1.5; sumber pendamping: Kurikulum Pelatihan Saung Angklung Udjo
  lesson_id: angklung
  text: "Saat bermain angklung, tangan kiri memegang simpul pertemuan tiang rangka bagian atas (atau bagian bawah rangka pada angklung besar), sementara tangan kanan memegang ujung tabung dasar bagian bawah untuk menggetarkannya."
  source:
    title: "Kementerian Pendidikan dan Kebudayaan RI. Panduan Pembelajaran Seni Musik Angklung"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-030
  # dari KB chunk 1.5
  lesson_id: angklung
  text: "Kurulung (getar) adalah teknik dasar bermain angklung yang paling umum: tabung dasar digetarkan ke kiri dan ke kanan dengan cepat dan tetap, sehingga terdengar nada panjang yang bersambung."
  source:
    title: "Kementerian Pendidikan dan Kebudayaan RI. Panduan Pembelajaran Seni Musik Angklung"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-031
  # dari KB chunk 1.5
  lesson_id: angklung
  text: "Centok (staccato) adalah teknik menyentakkan tabung dasar ke arah telapak tangan kanan dengan cepat satu kali, sehingga terdengar bunyi pendek yang tegas dan terputus."
  source:
    title: "Kementerian Pendidikan dan Kebudayaan RI. Panduan Pembelajaran Seni Musik Angklung"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-032
  # dari KB chunk 1.5
  lesson_id: angklung
  text: "Tengkep adalah teknik menahan salah satu tabung suara, biasanya tabung kecil, dengan jari saat angklung digetarkan. Hanya satu tabung yang berbunyi, sehingga suaranya lebih tipis dan halus."
  source:
    title: "Kementerian Pendidikan dan Kebudayaan RI. Panduan Pembelajaran Seni Musik Angklung"
    type: buku
    accessed: 2026-11-26
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-033
  # dari KB chunk 1.6; CLAUDE.md: peran Saung Angklung Udjo wajib diverifikasi; alamat dari dokumen KB
  lesson_id: angklung
  text: "Saung Angklung Udjo adalah sanggar seni, pusat pelestarian, bengkel pembuatan angklung, sekaligus tempat wisata budaya di Jalan Padasuka No. 118, Bandung Timur."
  source:
