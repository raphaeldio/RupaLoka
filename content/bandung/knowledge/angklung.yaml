- id: angklung-035
  # dari KB chunk 2.8; sumber pendamping: Arsip Dokumentasi KAA 1955; Profil Saung Angklung Udjo
  lesson_id: angklung
  text: "Di Bandung, Daeng Soetigna membentuk kelompok angklung pelajar yang tampil pada momen kenegaraan penting, seperti Perjanjian Linggarjati (1946) dan Konferensi Asia-Afrika di Bandung (1955)."
  source:
    title: "Kementerian Pendidikan dan Kebudayaan RI. Warisan Budaya Takbenda: Angklung"
    type: dokumen
