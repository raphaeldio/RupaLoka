  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-036
  # dari KB chunk 2.8; CLAUDE.md: peran Saung Angklung Udjo wajib diverifikasi; 'puluhan ribu peserta' tanpa angka/tahun pasti; BENTROK dengan angklung-043 (Pemkot: rekor 2011, >5.000 orang di Amerika Serikat)
  lesson_id: angklung
  text: "Udjo Ngalagena meneruskan peran Daeng Soetigna melalui Saung Angklung Udjo di Bandung, yang menjadi pusat regenerasi seniman dan standardisasi produksi angklung berkualitas konser. Bandung juga menjadi tempat pemecahan rekor dunia permainan angklung massal dengan puluhan ribu peserta."
