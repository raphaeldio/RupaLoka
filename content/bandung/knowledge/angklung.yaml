- id: angklung-011
  # artikel opini peneliti independen di situs Setneg; periksa KH
  lesson_id: angklung
  text: "Dahulu angklung dipakai dalam upacara untuk Nyai Sri Pohaci (Dewi Padi) dan dalam Seren Taun, sebagai doa bagi padi dan ungkapan syukur atas panen. Kini angklung digunakan secara luas sebagai hiburan."
  source:
    title: "Kementerian Sekretariat Negara RI (2024, 25 Maret). Angklung Sebagai Representasi Diplomasi Budaya Indonesia"
    url: https://setneg.go.id/baca/index/angklung_sebagai_representasi_diplomasi_budaya_indonesia
