    accessed: 2026-11-21
  verified_by: "Tim KamiPemenang"
  verified_at: 2026-11-26

- id: angklung-013
  # artikel opini peneliti independen di situs Setneg; periksa KH
  lesson_id: angklung
  text: "Pada 1908, utusan Kerajaan Thailand datang ke Indonesia untuk belajar angklung dan membawa pulang satu set berisi 10 angklung. Di Thailand angklung dikenal luas dengan nama angkalung."
  source:
    title: "Kementerian Sekretariat Negara RI (2024, 25 Maret). Angklung Sebagai Representasi Diplomasi Budaya Indonesia"
