  # dari KB chunk 1.6; CLAUDE.md: peran Saung Angklung Udjo wajib diverifikasi; nama 'Bambu Petang' TIDAK ditemukan di situs SAU maupun laman Pemkot (cek 26 Nov)
  lesson_id: angklung
  text: "Saung Angklung Udjo dikenal lewat pertunjukan harian Bambu Petang yang memadukan wayang golek, helaran, tari tradisional, permainan angklung anak-anak, dan sesi bermain angklung bersama seluruh penonton."
  source:
