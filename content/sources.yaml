# Objek game. Rintangan di city.yaml harus terdaftar di sini dan disetujui KH (approved_by).
# sensitive: true = objek budaya/sakral/dihormati; validator MENOLAK bila dipakai sebagai rintangan
# (PRD §7: objek budaya adalah hadiah, bukan sesuatu yang ditabrak).
objects:
  - id: batu
    name: Batu
    sensitive: false
    approved_by: null             # [PERLU DIISI] nama penyetuju (KH)
  - id: pagar
    name: Pagar
    sensitive: false
    approved_by: null
  - id: becak
    name: Becak
    sensitive: false
    approved_by: null
    note: "Kandidat dari SDD; KH memastikan tidak menyinggung pengemudi/komunitas"
  - id: angklung
    name: Angklung
    sensitive: true
    note: "Objek budaya; hanya sebagai item hadiah"
  - id: wayang-golek
    name: Wayang golek
    sensitive: true
    note: "Objek budaya; hanya sebagai item hadiah"
